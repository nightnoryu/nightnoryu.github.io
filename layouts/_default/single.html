{{ define "main" }}
<article class="page-section article">
  {{ with .Site.GetPage "/posts" }}<a class="text-link" href="{{ .RelPermalink }}">← {{ i18n "backToBlog" }}</a>{{ end }}
  <header class="article-header"><p class="eyebrow"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time><span aria-hidden="true"> / </span>{{ i18n "readingTime" .ReadingTime }}</p><h1>{{ .Title }}</h1>{{ with .Description }}<p class="article-description">{{ . }}</p>{{ end }}</header>
  <div class="prose">{{ .Content }}</div>
</article>
{{ end }}
